<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Password Reset — REC Transport</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:24px;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border-radius:10px; padding:24px;">
    <h2 style="margin:0 0 12px; color:#1e293b;">Password Reset</h2>
    <p style="color:#475569; line-height:1.6;">
      We received a request to reset your password for the REC Transport portal.
      Use the verification code below on the reset page:
    </p>
    <div style="text-align:center; font-size:32px; font-weight:700; letter-spacing:8px; background:#eff6ff; border:2px dashed #2563eb; border-radius:10px; padding:18px; margin:24px 0; color:#1e40af;">
      {{ verification_code }}
    </div>
    <p style="color:#64748b; font-size:14px; margin:0;">
      This code expires in 15 minutes. If you did not request this, you can ignore this email.
    </p>
    <p style="margin-top:24px; color:#64748b; font-size:14px;">
      Best regards,<br><strong>REC Transport Team</strong>
    </p>
  </div>
</body>
</html>
